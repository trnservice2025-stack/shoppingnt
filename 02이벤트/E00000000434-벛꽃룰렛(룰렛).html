<script>
$(function(){
    $('a[href]').each(function(){
        var $a = $(this);
        var href = $a.attr('href');

        if (
            !href ||
            href.startsWith('#') ||
            href.startsWith('javascript:')
        ) {
            return;
        }

        var isRelative =
            !href.startsWith('http://') &&
            !href.startsWith('https://');

        if (isRelative) {
            if (href.startsWith('/')) {
                href = 'https://www.shoppingntmall.com' + href;
            } else {
                href = 'https://www.shoppingntmall.com/' + href;
            }

            $a.attr('href', href);
            $a.attr('target', '_blank');
        }
    });
});
</script>
