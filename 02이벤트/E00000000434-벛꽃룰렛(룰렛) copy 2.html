<script>
$(function(){
    $('a[href]').each(function(){
        var $a = $(this);
        var href = $a.attr('href');

        if (
            !href ||
            href.startsWith('#') ||
            href.startsWith('javascript:')
        ) {
            return;
        }

        var isRelative =
            !href.startsWith('http://') &&
            !href.startsWith('https://');

        if (isRelative) {
            if (href.startsWith('/')) {
                href = 'https://www.shoppingntmall.com' + href;
            } else {
                href = 'https://www.shoppingntmall.com/' + href;
            }

            $a.attr('href', href);
            $a.attr('target', '_blank');
        }
    });
});
</script>

<script type="text/javascript">
    $(document).ready(function () {
        var rolLength = 8;   // 룰렛 칸 수
        var setNum = 0;      // 당첨 번호
        var currentDeg = 0;  // 누적 회전 각도

        // 0 ~ 7 랜덤
        const rRandom = () => {
            return Math.floor(Math.random() * rolLength);
        };

        // 룰렛 회전
        const rRotate = () => {
            var panel = document.querySelector(".roule-wacu");
            var btn = document.querySelector(".roule-btn");

            var oneDeg = 360 / rolLength;
            setNum = rRandom();

            // 8바퀴 + 당첨 위치
            currentDeg += (360 * 8) + (oneDeg * setNum);

            btn.disabled = true;
            btn.style.pointerEvents = "none";

            panel.style.transition = "transform 3s ease-out";
            panel.style.transform = "rotate(" + currentDeg + "deg)";
        };

        // 당첨 결과 팝업
        const rLayerPopup = (num) => {
            switch (num) {

                    alert("축하합니다!\n상품에 당첨되셨습니다!");
                    break;
                case 1:
                    alert("축하합니다!\n상품에 당첨되셨습니다!");
                    break;

                    break;

                    break;
                case 7:
                    alert("축하합니다!\n상품에 당첨되셨습니다!");
                    break;
            }
        };

        // 회전 종료 후 버튼 복구 + 결과 출력
        const rReset = (ele) => {
            setTimeout(() => {
                ele.disabled = false;
                ele.style.pointerEvents = "auto";
                rLayerPopup(setNum);
            }, 3000);
        };

        // 시작 버튼 클릭
        $(document).on("click", ".roule-btn", function () {
            if ($(this).prop("disabled")) return;

            rRotate();
            rReset(this);
        });

        // 기존 부가 기능 유지
        $('.pop-roule-close').click(function () {

</script>
