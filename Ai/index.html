<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Promotion Generator</title>
<style>
body {font-family: Arial; padding:20px;}
textarea {width:100%; height:220px;}
button {margin-top:10px; padding:10px 20px; font-size:16px;}
</style>
</head>
<body>

<h2>프로모션 생성기</h2>

<textarea id="input" placeholder="이미지URL / 상품코드 / 링크를 줄 단위로 입력"></textarea>
<br>
<button onclick="generate()">생성</button>

<script>

function isImage(line){
  return line.startsWith("http") && (line.includes(".png") || line.includes(".jpg") || line.includes(".jpeg"));
}

function isProductCode(line){
  return /^\d+$/.test(line);
}

function isLink(line){
  return line.startsWith("http") && !line.match(/\.(png|jpg|jpeg)/);
}

function getClass(img){
  if(img.includes("w100")) return "w100";
  if(img.includes("w50")) return "w50";
  if(img.includes("w33")) return "w33";
  if(img.includes("w25")) return "w25";
  if(img.includes("w20")) return "w20";
  if(img.includes("w16")) return "w16";
  return "w100";
}

function getBaseStyle(){
return `<style>
  .promotion_con * {line-height:initial;}
  .promotion_con {font-size:0; max-width:1200px; margin:0 auto;}
  .promotion_con img {width:100%; display:block;}
  .promotion_con a, .promotion_con button {background:none; cursor:pointer; font-size:0;}
  .promotion_con a, .promotion_con img {background:none;}

  .promotion_con .w50, .promotion_con .w33, .promotion_con .w25, .promotion_con .w20, .promotion_con .w16 {display:inline-block; vertical-align:middle;}
  .promotion_con .w100 {width:100%;}
  .promotion_con .w50 {width:50%;}
  .promotion_con .w33 {width:33.33%;}
  .promotion_con .w25 {width:25%;}
  .promotion_con .w20 {width:20%;}
  .promotion_con .w16 {width:16.66%;}  

  @media screen and (max-width:720px)  {
    .promotion_con {overflow:hidden;}
    .promotion_con_mo {margin:0 -33.33%;}
  }

  .pro_pc {display:block !important;}
  .pro_mo {display:none !important;} 
  @media screen and (max-width:720px) { 
      .pro_pc {display:none !important;} 
      .pro_mo {display:block !important;} 
  } 
</style>`;
}

function generate(){

  const input = document.getElementById("input").value
    .split("\n")
    .map(v => v.trim())
    .filter(v => v);

  let html = `<div class="promotion_con"><div class="promotion_con_mo">\n`;

  let i = 0;

  while(i < input.length){

    const line = input[i];

    // btnmo + btnpc 세트 처리 (안정 버전)
    if(isImage(line) && line.includes("btnmo")){
      const moImg = line;
      const next = input[i+1];

      if(next && next.includes("btnpc")){
        const pcImg = next;
        const link = input[i+2];

        html += `<a href="${link}" class="pro_mo"><img src="${moImg}"></a>\n`;
        html += `<img src="${pcImg}" class="pro_pc">\n`;

        i += 3;
        continue;
      }
    }

    // btnpc 단독 방지
    if(isImage(line) && line.includes("btnpc")){
      i++;
      continue;
    }

    // 일반 이미지 처리
    if(isImage(line)){
      const img = line;
      const next = input[i+1];

      if(isProductCode(next)){
        const cls = getClass(img);
        html += `   <a href="/display/goods/${next}" class="${cls}"><img src="${img}"></a>\n`;
        i += 2;
      } else {
        html += `  <img src="${img}">\n`;
        i += 1;
      }

      continue;
    }

    i++;
  }

  html += `</div></div>\n`;
  html += getBaseStyle();

  // preview + 코드 출력
  const preview = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Preview</title>
</head>
<body>

${html}

<div style="margin-top:50px; padding:20px; background:#f5f5f5;">
<h3>생성된 코드</h3>
<textarea id="code" style="width:100%; height:300px;">${html.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
<br>
<button onclick="copy()">복사</button>
</div>

<script>
function copy(){
  const t = document.getElementById('code');
  t.select();
  document.execCommand('copy');
  alert('복사 완료');
}
<\/script>

</body>
</html>
`;

  const win = window.open();
  win.document.write(preview);
  win.document.close();

}

</script>

</body>
</html>
