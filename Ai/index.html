<!-- index.html (수정 버전) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Promotion Generator</title>
<style>
body {font-family: Arial; padding:20px;}
textarea {width:100%; height:200px;}
button {margin-top:10px; padding:10px 20px; font-size:16px;}
</style>
</head>
<body>

<h2>프로모션 생성기</h2>

<textarea id="input" placeholder="이미지URL / 상품코드 / 링크를 줄 단위로 입력"></textarea>
<br>
<button onclick="generate()">생성</button>

<script>
async function generate(){

  const input = document.getElementById("input").value;

  try {

    const res = await fetch("https://teammp.diskstation.me/api.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ input })
    });

    const text = await res.text();
    console.log(text);

    if (!res.ok) {
      alert("서버 오류:\n" + text);
      return;
    }

    const html = text;

    const preview = `
<html>
<head><meta charset="UTF-8"></head>
<body>

${html}

<div style="margin-top:50px; padding:20px; background:#f5f5f5;">
<h3>생성된 코드</h3>
<textarea id="code" style="width:100%; height:300px;">${html.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
<br>
<button onclick="copy()">복사</button>
</div>

<script>
function copy(){
  const t = document.getElementById('code');
  t.select();
  document.execCommand('copy');
  alert('복사 완료');
}
<\/script>

</body>
</html>
`;

    const win = window.open();
    win.document.write(preview);
    win.document.close();

  } catch (e) {
    console.error(e);
    alert("요청 실패 (CORS / HTTPS 확인)");
  }
}
</script>

</body>
</html>
