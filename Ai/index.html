<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Promotion Generator</title>
<style>
body {font-family: Arial; padding:20px;}
textarea {width:100%; height:200px;}
button {margin-top:10px; padding:10px 20px; font-size:16px;}
</style>
</head>
<body>

<h2>프로모션 생성기</h2>

<p>이미지URL + 상품코드 (줄 순서대로 입력)</p>
<textarea id="input"></textarea>

<button onclick="generate()">생성</button>

<script>

async function loadRules(){
  const res = await fetch("gpt_rules.html");
  return await res.text();
}

function getClass(img){
  if(img.includes("w100")) return "w100";
  if(img.includes("w50")) return "w50";
  if(img.includes("w33")) return "w33";
  if(img.includes("w25")) return "w25";
  if(img.includes("w20")) return "w20";
  if(img.includes("w16")) return "w16";
  return "w100";
}

async function generate(){

  const input = document.getElementById("input").value.split("\n").map(v => v.trim()).filter(v => v);
  const rules = await loadRules();

  let html = `<div class="promotion_con"><div class="promotion_con_mo">\n`;

  for(let i = 0; i < input.length; i += 2){
    const img = input[i];
    const code = input[i+1] || "";

    if(!code){
      html += `  <img src="${img}">\n`;
    } else {
      const cls = getClass(img);
      html += `   <a href="/display/goods/${code}" class="${cls}"><img src="${img}"></a>\n`;
    }
  }

  html += `</div></div>\n`;

  // style 붙이기
  if(rules.includes("<style>")){
    const style = rules.split("<style>")[1].split("</style>")[0];
    html += `<style>${style}</style>`;
  }

  // 미리보기 + 코드 출력
  const preview = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Preview</title>
</head>
<body>

${html}

<div style="margin-top:50px; padding:20px; background:#f5f5f5;">
  <h3>생성된 코드</h3>
  <textarea id="result" style="width:100%; height:300px;">${html.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
  <button onclick="copyCode()">복사</button>
</div>

<script>
function copyCode(){
  const text = document.getElementById("result");
  text.select();
  document.execCommand("copy");
  alert("복사 완료");
}
<\/script>

</body>
</html>
`;

  const win = window.open();
  win.document.write(preview);
  win.document.close();

}

</script>

</body>
</html>
