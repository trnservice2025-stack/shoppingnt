<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Generator</title>
<style>
textarea {width:100%; height:150px;}
button {margin-top:10px;}
</style>
</head>
<body>

<h2>프로모션 생성기</h2>

<textarea id="images" placeholder="이미지 URL"></textarea>
<textarea id="codes" placeholder="상품코드"></textarea>

<button onclick="generate()">생성</button>

<script>

async function loadRules(){
  const res = await fetch("gpt_rules.html");
  return await res.text();
}

function getClass(img){
  if(img.includes("w100")) return "w100";
  if(img.includes("w50")) return "w50";
  if(img.includes("w33")) return "w33";
  if(img.includes("w25")) return "w25";
  if(img.includes("w20")) return "w20";
  if(img.includes("w16")) return "w16";
  return "w100";
}

async function generate(){

  const images = document.getElementById("images").value.split("\n");
  const codes = document.getElementById("codes").value.split("\n");

  // 규칙 파일 로드 (필요하면 활용 가능)
  const rules = await loadRules();

  let html = `<div class="promotion_con"><div class="promotion_con_mo">\n`;

  images.forEach((img, i) => {

    img = img.trim();
    if(!img) return;

    const code = codes[i] ? codes[i].trim() : "";

    if(!code){
      html += `  <img src="${img}">\n`;
    } else {
      const cls = getClass(img);
      html += `   <a href="/display/goods/${code}" class="${cls}"><img src="${img}"></a>\n`;
    }

  });

  html += `</div></div>\n`;

  // rules 파일에서 style 추출해서 붙이기 (선택)
  if(rules.includes("<style>")){
    const style = rules.split("<style>")[1].split("</style>")[0];
    html += `<style>${style}</style>`;
  }

  const win = window.open();
  win.document.write(html);
  win.document.close();
}

</script>

</body>
</html>
