<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Promotion Generator (TEST)</title>
<style>
body {font-family: Arial; padding:20px;}
textarea {width:100%; height:200px;}
button {margin-top:10px; padding:10px 20px; font-size:16px;}
</style>
</head>
<body>

<h2>프로모션 생성기 (테스트용)</h2>

<textarea id="input" placeholder="이미지URL / 상품코드 / 링크를 줄 단위로 입력"></textarea>
<br>
<button onclick="generate()">생성</button>

<script>

async function loadRules(){
  const res = await fetch("gpt_rules.html");
  return await res.text();
}

async function generate(){

  const input = document.getElementById("input").value;
  const rules = await loadRules();

  const prompt = `
${rules}

${input}
`;

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer YOUR_OPENAI_API_KEY"
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: [
        { role: "user", content: prompt }
      ]
    })
  });

  const data = await res.json();
  const html = data.choices[0].message.content;

  const preview = `
<html>
<head><meta charset="UTF-8"></head>
<body>

${html}

<div style="margin-top:50px; padding:20px; background:#f5f5f5;">
<h3>생성된 코드</h3>
<textarea id="code" style="width:100%; height:300px;">${html.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
<br>
<button onclick="copy()">복사</button>
</div>

<script>
function copy(){
  const t = document.getElementById('code');
  t.select();
  document.execCommand('copy');
  alert('복사 완료');
}
<\/script>

</body>
</html>
`;

  const win = window.open();
  win.document.write(preview);
  win.document.close();

}

</script>

</body>
</html>
